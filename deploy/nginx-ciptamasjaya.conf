# Nginx — PT. Cipta Mas Jaya (Astro static)
# Pola dari jasa-perijinan-csms.lan.conf. Pasang via aaPanel (Simpan sebagai vhost)
# atau copy ke /www/server/nginx/conf/vhost/ciptamasjaya.co.id.conf lalu reload nginx.
#
# Mode LOKAL (dev LAN):
#   server_name astro-ciptamasjaya.lan;
#
# Mode PRODUKSI:
#   1. Build: SITE_URL=https://www.ciptamasjaya.co.id npm run build
#   2. Arahkan DNS A record ciptamasjaya.co.id → IP server ini
#   3. Terbitkan SSL (Let's Encrypt) via aaPanel, lalu aktifkan blok https di bawah

server {
    listen 80;
    server_name astro-ciptamasjaya.lan;
    # server_name ciptamasjaya.co.id www.ciptamasjaya.co.id;   # ← produksi

    root /www/wwwroot/astro-ciptamasjaya/dist;
    index index.html;

    # URL tanpa trailing slash diarahkan 301 ke bentuk kanonik (persis perilaku WP)
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    # Gambar mirror WordPress — URL identik dengan situs lama
    location /wp-content/uploads/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Aset hashed Astro — cache permanen
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/xml application/json image/svg+xml;

    # Sitemap & robots tanpa cache
    location = /sitemap.xml { add_header Content-Type "application/xml; charset=utf-8"; }
    location = /robots.txt  { add_header Content-Type "text/plain; charset=utf-8"; }

    # access_log /www/wwwlogs/astro-ciptamasjaya.lan.log;
}

